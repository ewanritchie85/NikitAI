[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nikitai"
version = "0.1.0"
description = "AI-powered personal assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "Your Name", email = "you@example.com" } ]
dependencies = [
    "anthropic>=0.28.0",
    "garminconnect>=0.3.2,<0.3.3",
    "msal>=1.28.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pytest>=7.0",
    "argon2-cffi>=23.1.0",
    "itsdangerous>=2.1.0",
    "pywizlight>=0.6.6",
]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.run]
source = ["src/nikitai"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

